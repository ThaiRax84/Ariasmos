{% extends "asistente/_base.html" %}
{% block asistente %}
{% if texto_clave %}
<section class="panel">
  <h2>Clave de recuperación de los respaldos</h2>
  {% include "respaldos/_clave.html" with texto=texto_clave %}
</section>
{% endif %}
<form method="post" class="formulario" novalidate>
  {% csrf_token %}
  {% include "comun/_campos.html" %}
  <div class="acciones">
    {% include "asistente/_atras.html" %}
    <button class="boton grande" type="submit">Guardar y continuar</button>
    <button class="boton secundario" type="submit" name="omitir" value="1" formnovalidate>Omitir por ahora</button>
  </div>
</form>
{% endblock %}
