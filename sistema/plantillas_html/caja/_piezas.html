{% load formato %}<div class="piezas"{% if mosaicos %} data-mosaicos data-simbolo="{{ moneda.simbolo }}" data-moneda="{{ moneda.codigo }}"{% endif %}>{% for campo in campos %}
  <div class="pieza{% if campo.errors %} con-error{% endif %}" data-centavos="{{ campo.name|slice:'2:' }}">
    <label class="denominacion" for="{{ campo.id_for_label }}"><span class="solo-lectores">{{ prefijo }} </span>{{ campo.label|denominacion_corta }}</label>
    {{ campo }}
    {% for e in campo.errors %}<p class="error">{{ e }}</p>{% endfor %}
  </div>{% endfor %}
</div>
