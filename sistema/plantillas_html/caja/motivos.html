{% extends "base.html" %}
{% block contenido %}
<div class="encabezado">
  <div class="encabezado-texto">
    <span class="antetitulo">Configuración · Motivos de retiro</span>
    <h1>Motivos de retiro</h1>
  </div>
</div>
<div class="atajos"><a class="boton" href="{% url 'caja:motivo_nuevo' %}">Nuevo motivo</a></div>
<table class="tabla">
<thead><tr><th>Nombre</th><th>Activo</th><th></th></tr></thead>
<tbody>{% for m in motivos %}<tr><td>{{ m.nombre }}</td><td>{{ m.activo|yesno:"Sí,No" }}</td><td><a href="{% url 'caja:motivo_editar' m.pk %}">Editar</a></td></tr>{% empty %}<tr><td colspan="3">Sin motivos.</td></tr>{% endfor %}</tbody>
</table>
{% endblock %}
