{% load formato %}<div class="campo{% if campo.errors %} con-error{% endif %}{% if campo.widget_type == 'checkbox' %} casilla{% elif campo.widget_type == 'radioselect' %} opciones{% if campo.field.en_fila %} en-fila{% endif %}{% endif %}"{{ campo.field|dependencia }}>
  {% if campo.widget_type == 'checkbox' %}{{ campo }} {{ campo.label_tag }}{% else %}{{ campo.label_tag }} {{ campo }}{% endif %}
  {% if campo.help_text %}<small>{{ campo.help_text }}</small>{% endif %}
  {{ campo.field|nota_dependencia }}
  {% for e in campo.errors %}<p class="error">{{ e }}</p>{% endfor %}
</div>
