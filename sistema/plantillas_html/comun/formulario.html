{% extends "base.html" %}
{% block contenido %}
<h1>{{ titulo }}</h1>
<form method="post" class="formulario" novalidate>
  {% csrf_token %}
  {% include "comun/_campos.html" %}
  <div class="acciones">
    <button class="boton" type="submit">{{ boton }}</button>
    {% if volver %}<a class="boton secundario" href="{% url volver %}">Cancelar</a>{% endif %}
  </div>
</form>
{% endblock %}
