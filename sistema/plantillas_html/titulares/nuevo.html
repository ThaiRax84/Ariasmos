{% extends "base.html" %}
{% block contenido %}
<div class="encabezado">
  <div class="encabezado-texto">
    <span class="antetitulo">{{ voc.titulares }}</span>
    <h1>Alta de {{ voc.titular|lower }}</h1>
    <p class="subtitulo">Al guardar se asigna la {{ voc.matricula|lower }} y ya se puede imprimir la ficha de pago.</p>
  </div>
</div>
<form method="post" class="formulario" novalidate>
  {% csrf_token %}
  {% include "comun/_campos.html" %}
  <div class="acciones">
    <button class="boton grande" type="submit">Guardar alta</button>
    <a class="boton secundario" href="{% url 'titulares:lista' %}">Cancelar</a>
  </div>
</form>
{% endblock %}
